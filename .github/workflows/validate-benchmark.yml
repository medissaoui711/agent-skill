name: Validate Code Review Benchmark

on:
  pull_request:
    branches: [main, feat/phase-5g-evidence-infra]
    paths:
      - 'benchmark/**'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/validate-benchmark.yml'
  push:
    branches: [main, feat/phase-5g-evidence-infra]
    paths:
      - 'benchmark/**'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/validate-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public benchmark dataset and evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install benchmark test dependencies
        run: python -m pip install 'jsonschema[format]==4.25.1'
      - name: Validate public dataset
        run: python benchmark/evaluator/validate_dataset.py
      - name: Run evaluator unit and integration tests
        run: python -m unittest discover -s benchmark/tests -v
